<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBM Automation Product Portfolio</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.6;color:#1f2328;display:flex;flex-direction:column;background:#f0f2f5;}

/* ── Header ── */
.header{background:#0f2547;color:#fff;padding:16px 28px 0;flex-shrink:0;}
.header-top{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;}
.header-top h1{font-size:19px;font-weight:700;letter-spacing:-0.3px;}
.header-top p{font-size:12px;color:#a8bcd4;}

/* ── Tabs ── */
.pillar-tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;}
.pillar-tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  padding:9px 17px;font-size:12px;font-weight:600;
  color:rgba(255,255,255,0.6);border:none;background:transparent;
  cursor:pointer;white-space:nowrap;
  border-bottom:3px solid transparent;
  transition:color .15s,border-color .15s;
}
.tab-btn:hover{color:rgba(255,255,255,0.9);}
.tab-btn.active{color:#fff;border-bottom-color:var(--tc);}

/* ── Workspace ── */
.workspace{display:flex;flex:1;overflow:hidden;}

/* ── Left panel ── */
.left-panel{width:265px;flex-shrink:0;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden;}
.lp-header{padding:11px 16px 9px;border-bottom:1px solid #e5e7eb;flex-shrink:0;}
.lp-pillar-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#57606a;}
.lp-count{font-size:11px;color:#9ca3af;margin-top:1px;}
.product-list{flex:1;overflow-y:auto;padding:4px 0;}
.pli{
  padding:9px 16px;font-size:13px;cursor:pointer;
  border-left:3px solid transparent;color:#374151;
  transition:background .1s;line-height:1.4;
}
.pli:hover{background:#f7f8fa;}
.pli.active{background:#eef2ff;font-weight:600;border-left-color:var(--pc);color:var(--pc);}

/* ── Right panel ── */
.right-panel{flex:1;overflow-y:auto;padding:24px 30px 48px;background:#f0f2f5;}
.rp-inner{max-width:880px;}

/* ── Product detail ── */
.pd-name{font-size:21px;font-weight:700;color:#1f2328;line-height:1.3;}
.pd-badge{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 10px;border-radius:20px;color:#fff;background:var(--pc);}
.product-desc{font-size:13px;color:#57606a;margin:14px 0 20px;line-height:1.65;padding:14px 16px;background:#fff;border-radius:6px;border-left:3px solid #e5e7eb;}
.solutions-grid{display:flex;flex-direction:column;gap:14px;}
.solution-item{background:#fff;border-radius:8px;padding:14px 16px;border-left:3px solid #3b82d4;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.solution-name{font-size:13px;font-weight:700;color:#3b82d4;margin-bottom:5px;}
.solution-desc{font-size:13px;color:#1f2328;margin-bottom:4px;line-height:1.55;}
.meta-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.meta-chip{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;}
.chip-why{background:#dbeafe;color:#1d4ed8;}
.chip-who{background:#d1fae5;color:#065f46;}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#57606a;margin-bottom:3px;margin-top:10px;}
.examples{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
.example-item{font-size:12px;color:#1f2328;background:#f7f8fa;border:1px solid #e5e7eb;border-radius:5px;padding:7px 10px 7px 22px;position:relative;line-height:1.55;}
.example-item::before{content:"▸";position:absolute;left:8px;color:#7c5cd8;font-size:11px;top:7px;}

/* ── Footer ── */
.app-footer{flex-shrink:0;text-align:center;font-size:11px;color:#9ca3af;border-top:1px solid #e5e7eb;padding:7px;background:#fff;}

/* ── Print ── */
@media print {
  html,body{height:auto;overflow:visible;}
  .workspace{display:block;overflow:visible;height:auto;}
  .left-panel{display:none;}
  .right-panel{overflow:visible;height:auto;padding:0;}
  .header{background:#0f2547 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .solution-item,.example-item,.product-desc{-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid;}
  .app-footer{display:none;}
}
</style>
</head>

            <div class="example-item"><strong>Sporting Goods Company:</strong> A sports retailer uses Sterling Inventory Optimisation to reduce seasonal overstock — AI demand sensing adjusts replenishment orders based on real-time sales velocity and weather signals (a cold snap triggering early winter apparel buying). The retailer reduces end-of-season markdown inventory by 22% and improves full-price sell-through, recovering $15M in annual margin.</div>
          </div>
        </div>
      </div>`,
      },
    ],
  },
];

let ap = 0, aq = 0;

function ht(html){ const d=document.createElement('div'); d.innerHTML=html; return d.textContent; }

function renderTabs(){
  const c=document.getElementById('tabs');
  c.innerHTML='';
  PILLARS.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='tab-btn'+(i===ap?' active':'');
    b.style.setProperty('--tc',p.color);
    b.textContent=ht(p.label);
    b.addEventListener('click',()=>{ ap=i; aq=0; render(); });
    c.appendChild(b);
  });
}

function renderLeft(){
  const p=PILLARS[ap];
  document.getElementById('lpName').textContent=ht(p.label);
  document.getElementById('lpCount').textContent=p.products.length+' products';
  const list=document.getElementById('productList');
  list.innerHTML='';
  p.products.forEach((prod,i)=>{
    const el=document.createElement('div');
    el.className='pli'+(i===aq?' active':'');
    el.style.setProperty('--pc',p.color);
    el.textContent=ht(prod.name);
    el.addEventListener('click',()=>{
      aq=i;
      document.querySelectorAll('.pli').forEach((e,j)=>e.classList.toggle('active',j===i));
      renderRight();
    });
    list.appendChild(el);
  });
}

function renderRight(){
  const p=PILLARS[ap];
  const prod=p.products[aq];
  const inner=document.getElementById('rpInner');
  inner.style.setProperty('--pc',p.color);
  inner.innerHTML=
    '<div class="pd-name">'+ht(prod.name)+'</div>'+
    '<span class="pd-badge">'+ht(p.label)+'</span>'+
    prod.html;
  document.getElementById('rp').scrollTop=0;
}

function render(){ renderTabs(); renderLeft(); renderRight(); }
render();
</script>
</body>
</html>
