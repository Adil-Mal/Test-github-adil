<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Automation &amp; FinOps, IBM Product Portfolio</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.6;color:#1f2328;display:flex;flex-direction:column;background:#f0f2f5;}

/* ── Header ── */
.header{background:#0f2547;color:#fff;padding:16px 28px 0;flex-shrink:0;}
.header-top{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
.header-top h1{font-size:19px;font-weight:700;letter-spacing:-.3px;}
.pillar-badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 11px;border-radius:20px;background:#7c5cd8;color:#fff;white-space:nowrap;}
.header-sub{font-size:12px;color:#a8bcd4;margin-bottom:14px;}

/* ── Search + filter bar ── */
.toolbar{background:#162b55;border-top:1px solid rgba(255,255,255,.1);padding:10px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:340px;}
.search-wrap input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 10px 6px 30px;font-size:12px;color:#fff;outline:none;transition:background .15s;}
.search-wrap input::placeholder{color:rgba(255,255,255,.45);}
.search-wrap input:focus{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.45);font-size:13px;pointer-events:none;}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.filter-label{font-size:11px;color:rgba(255,255,255,.5);font-weight:600;white-space:nowrap;}
.fc{font-size:11px;font-weight:600;padding:3px 11px;border-radius:20px;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;}
.fc.all{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);}
.fc.all.active{background:#7c5cd8;border-color:#7c5cd8;}
.fc.cat{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.15);}
.fc.cat.active{background:#7c5cd8;border-color:#7c5cd8;color:#fff;}

/* ── Workspace ── */
.workspace{display:flex;flex:1;overflow:hidden;}

/* ── Left panel ── */
.left-panel{width:265px;flex-shrink:0;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden;}
.lp-header{padding:11px 16px 9px;border-bottom:1px solid #e5e7eb;flex-shrink:0;}
.lp-pillar-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#57606a;}
.lp-count{font-size:11px;color:#9ca3af;margin-top:1px;}
.product-list{flex:1;overflow-y:auto;padding:4px 0;}
.pli{padding:9px 16px;font-size:13px;cursor:pointer;border-left:3px solid transparent;color:#374151;transition:background .1s;line-height:1.4;}
.pli:hover{background:#f7f8fa;}
.pli.active{background:#eef2ff;font-weight:600;border-left-color:var(--pc,#7c5cd8);color:var(--pc,#7c5cd8);}
.pli-cat{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:#9ca3af;margin-top:2px;}
.no-results{padding:20px 16px;font-size:12px;color:#9ca3af;text-align:center;}

/* ── Right panel ── */
.right-panel{flex:1;overflow-y:auto;padding:24px 30px 48px;background:#f0f2f5;}
.rp-inner{max-width:880px;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:#9ca3af;gap:8px;}
.empty-state svg{opacity:.3;}
.empty-state p{font-size:14px;}

/* ── Product detail ── */
.pd-name{font-size:21px;font-weight:700;color:#1f2328;line-height:1.3;}
.pd-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.pd-badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 10px;border-radius:20px;color:#fff;background:#7c5cd8;}
.pd-badge.partner{background:#d97706;}
.product-desc{font-size:13px;color:#57606a;margin:14px 0 20px;line-height:1.65;padding:14px 16px;background:#fff;border-radius:6px;border-left:3px solid #7c5cd8;}
.solutions-grid{display:flex;flex-direction:column;gap:14px;}
.solution-item{background:#fff;border-radius:8px;padding:14px 16px;border-left:3px solid #7c5cd8;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.solution-name{font-size:13px;font-weight:700;color:#7c5cd8;margin-bottom:5px;}
.solution-desc{font-size:13px;color:#1f2328;margin-bottom:4px;line-height:1.55;}
.meta-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.meta-chip{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;}
.chip-why{background:#dbeafe;color:#1d4ed8;}
.chip-who{background:#d1fae5;color:#065f46;}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#57606a;margin-bottom:3px;margin-top:10px;}
.examples{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
.example-item{font-size:12px;color:#1f2328;background:#f7f8fa;border:1px solid #e5e7eb;border-radius:5px;padding:7px 10px 7px 22px;position:relative;line-height:1.55;}
.example-item::before{content:"▸";position:absolute;left:8px;color:#7c5cd8;font-size:11px;top:7px;}

/* ── Sales resources panel ── */
.sales-resources{margin-top:18px;background:#fff;border-radius:8px;padding:14px 16px;border-left:3px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.sales-resources-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#57606a;margin-bottom:9px;}
.sales-links{display:flex;flex-direction:column;gap:6px;}
.sales-link-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;}
.sales-link-type{flex-shrink:0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:20px;white-space:nowrap;margin-top:1px;}
.slt-product{background:#dbeafe;color:#1d4ed8;}
.slt-seismic{background:#fef9c3;color:#854d0e;}
.slt-announce{background:#f0fdf4;color:#166534;}
.slt-w3{background:#fdf2f8;color:#86198f;}
.slt-support{background:#fef3c7;color:#92400e;}
.sales-link-row a{color:#1f2328;text-decoration:none;line-height:1.45;word-break:break-all;}
.sales-link-row a:hover{text-decoration:underline;color:#3b82d4;}

/* ── Category group heading in product list ── */
.cat-group-label{padding:10px 16px 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#d97706;border-top:1px solid #f3f4f6;margin-top:4px;}
.cat-group-label:first-child{border-top:none;margin-top:0;}

/* ── Footer ── */
.app-footer{flex-shrink:0;text-align:center;font-size:11px;color:#9ca3af;border-top:1px solid #e5e7eb;padding:7px;background:#fff;}

/* ── Scrollbar styling ── */
.product-list::-webkit-scrollbar,.right-panel::-webkit-scrollbar{width:5px;}
.product-list::-webkit-scrollbar-track,.right-panel::-webkit-scrollbar-track{background:transparent;}
.product-list::-webkit-scrollbar-thumb,.right-panel::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:4px;}

/* ── Print ── */
@media print{
  html,body{height:auto;overflow:visible;}
  .workspace{display:block;overflow:visible;height:auto;}
  .left-panel,.toolbar{display:none;}
  .right-panel{overflow:visible;height:auto;padding:0;}
  .header{background:#0f2547 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .solution-item,.example-item,.product-desc{-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid;}
  .app-footer{display:none;}
}
</style>

    const gIdx = PRODUCTS.indexOf(p);
    if (!grouped[p.cat]) grouped[p.cat] = [];
    grouped[p.cat].push({ p, gIdx });
  });

  const catOrder = ['Observability', 'AIOps', 'FinOps', 'Portfolio', 'Automation'];
  catOrder.forEach(cat => {
    if (!grouped[cat]) return;
    const gl = document.createElement('div');
    gl.className = 'cat-group-label';
    gl.style.color = CAT_COLORS[cat] || '#57606a';
    gl.textContent = cat;
    productList.appendChild(gl);
    grouped[cat].forEach(({ p, gIdx }) => {
      const el = document.createElement('div');
      el.className = 'pli' + (gIdx === activeIdx ? ' active' : '');
      el.style.setProperty('--pc', CAT_COLORS[p.cat] || '#7c5cd8');
      el.innerHTML = `<div>${p.name}${p.partner ? ' <span style="font-size:10px;color:#d97706;font-weight:700;">PARTNER</span>' : ''}</div>`;
      el.addEventListener('click', () => { activeIdx = gIdx; renderList(); renderDetail(); });
      productList.appendChild(el);
    });
  });
}

// ── Render right panel ──
function renderDetail() {
  if (activeIdx === null || !PRODUCTS[activeIdx]) {
    rpInner.innerHTML = `<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h6M9 15h4"/></svg><p>Select a product from the list to explore its solutions</p></div>`;
    return;
  }
  const p = PRODUCTS[activeIdx];
  const col = CAT_COLORS[p.cat] || '#7c5cd8';
  let html = `<div class="pd-name">${p.name}</div>`;
  html += `<div class="pd-badges">`;
  html += `<span class="pd-badge" style="background:${col}">${p.cat}</span>`;
  if (p.partner) html += `<span class="pd-badge partner">IBM Partner Tool</span>`;
  if (p.link) html += `<a class="pd-badge" style="background:${col};text-decoration:none;" href="${p.link}" target="_blank" rel="noopener">&#127279; Product Page</a>`;
  html += `</div>`;
  html += `<p class="product-desc" style="border-left-color:${col}">${p.desc}</p>`;
  html += `<div class="solutions-grid">`;
  p.solutions.forEach(s => {
    html += `<div class="solution-item" style="border-left-color:${col}">`;
    html += `<div class="solution-name" style="color:${col}">${s.name}${s.link ? ` <a href="${s.link}" target="_blank" rel="noopener" style="font-size:11px;font-weight:400;color:${col};opacity:.75;text-decoration:none;margin-left:6px;">&#8599; docs</a>` : ''}</div>`;
    html += `<div class="solution-desc">${s.desc}</div>`;
    if (s.why && s.why.length) {
      html += `<div class="section-label">Why organisations use it</div>`;
      html += `<div class="meta-row">${s.why.map(w => `<span class="meta-chip chip-why">${w}</span>`).join('')}</div>`;
    }
    if (s.who && s.who.length) {
      html += `<div class="section-label">Who benefits</div>`;
      html += `<div class="meta-row">${s.who.map(w => `<span class="meta-chip chip-who">${w}</span>`).join('')}</div>`;
    }
    if (s.examples && s.examples.length) {
      html += `<div class="section-label">In Practice, ${s.examples.length} Example${s.examples.length > 1 ? 's' : ''}</div>`;
      html += `<div class="examples">`;
      s.examples.forEach(e => { html += `<div class="example-item">${e}</div>`; });
      html += `</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  if (p.salesLinks && p.salesLinks.length) {
    const typeLabel = {product:'Product Page',seismic:'Seismic',announce:'Announcement',w3:'w3 Internal',support:'Support'};
    const typeClass = {product:'slt-product',seismic:'slt-seismic',announce:'slt-announce',w3:'slt-w3',support:'slt-support'};
    html += `<div class="sales-resources">`;
    html += `<div class="sales-resources-label">&#128196; Sales &amp; Enablement Resources</div>`;
    html += `<div class="sales-links">`;
    p.salesLinks.forEach(sl => {
      const tc = typeClass[sl.type] || 'slt-product';
      const tl = typeLabel[sl.type] || sl.type;
      html += `<div class="sales-link-row"><span class="sales-link-type ${tc}">${tl}</span><a href="${sl.url}" target="_blank" rel="noopener">${sl.label}</a></div>`;
    });
    html += `</div></div>`;
  }
  rpInner.innerHTML = html;
  document.getElementById('rp').scrollTop = 0;
}

// ── Search ──
searchInput.addEventListener('input', () => {
  searchVal = searchInput.value.trim();
  activeIdx = null;
  renderList();
  renderDetail();
});

// ── Category filter chips ──
document.querySelectorAll('.fc').forEach(btn => {
  btn.addEventListener('click', () => {
    activeCat = btn.dataset.cat;
    document.querySelectorAll('.fc').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeIdx = null;
    renderList();
    renderDetail();
  });
});

// ── Initial render ──
renderList();
</script>
</body>
</html>
